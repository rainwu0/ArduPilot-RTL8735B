<text x="375.0" y="240.0" font-size="12" fill="#1e88e5" text-anchor="middle" font-weight="bold">microSD end</text>
<text x="375.0" y="760.0" font-size="12" fill="#616161" text-anchor="middle" font-weight="normal">USB-C end</text>
