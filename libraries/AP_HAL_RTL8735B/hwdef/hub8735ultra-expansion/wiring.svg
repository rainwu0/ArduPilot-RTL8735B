<text x="1400.0" y="780.0" font-size="11" fill="#212121" text-anchor="middle" font-weight="normal">front right, CCW</text>
<text x="1400.0" y="796.0" font-size="11" fill="#00838f" text-anchor="middle" font-weight="bold">ESC M1, output 1 (D11)</text>
<circle cx="1260" cy="970" r="22" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
<text x="1260.0" y="975.0" font-size="14" fill="#00838f" text-anchor="middle" font-weight="bold">2</text>
<text x="1260.0" y="1012.0" font-size="11" fill="#212121" text-anchor="middle" font-weight="normal">rear left, CCW</text>
<text x="1260.0" y="1028.0" font-size="11" fill="#00838f" text-anchor="middle" font-weight="bold">ESC M4, output 4 (D24)</text>
<circle cx="1260" cy="830" r="22" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
<text x="1260.0" y="835.0" font-size="14" fill="#00838f" text-anchor="middle" font-weight="bold">3</text>
<text x="1260.0" y="780.0" font-size="11" fill="#212121" text-anchor="middle" font-weight="normal">front left, CW</text>
<text x="1260.0" y="796.0" font-size="11" fill="#00838f" text-anchor="middle" font-weight="bold">ESC M3, output 3 (D23)</text>
<circle cx="1400" cy="970" r="22" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
<text x="1400.0" y="975.0" font-size="14" fill="#00838f" text-anchor="middle" font-weight="bold">4</text>
<text x="1400.0" y="1012.0" font-size="11" fill="#212121" text-anchor="middle" font-weight="normal">rear right, CW</text>
<text x="1400.0" y="1028.0" font-size="11" fill="#00838f" text-anchor="middle" font-weight="bold">ESC M2, output 2 (D22)</text>
<text x="1330.0" y="1054.0" font-size="12" fill="#616161" text-anchor="middle" font-weight="normal">ArduPilot motor numbers, Quad X, seen from above</text>
<text x="1330.0" y="1072.0" font-size="12" fill="#616161" text-anchor="middle" font-weight="normal">SERVO1–4_FUNCTION 33 / 36 / 35 / 34</text>
<text x="1330.0" y="1090.0" font-size="12" fill="#616161" text-anchor="middle" font-weight="normal">Rotation is set by the motor phase wires</text>
</svg>
