<rect width="1560" height="1130" fill="#ffffff"/>
<text x="40.0" y="44.0" font-size="22" fill="#212121" text-anchor="start" font-weight="bold">HUB 8735 ultra expansion board on a 3.5-inch quad: ESC, battery and power wiring</text>
<text x="40.0" y="68.0" font-size="13" fill="#616161" text-anchor="start" font-weight="normal">Top view, component side up; the HUB 8735 ultra plugs in on top. Red = power, black = ground, teal = DShot, brown = battery voltage, purple = current.</text>
<text x="40.0" y="88.0" font-size="13" fill="#616161" text-anchor="start" font-weight="normal">The board is the hand-built expansion board v1 (50 × 70 mm perfboard).</text>
<rect x="200.0" y="250.0" width="350.0" height="490.0" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
