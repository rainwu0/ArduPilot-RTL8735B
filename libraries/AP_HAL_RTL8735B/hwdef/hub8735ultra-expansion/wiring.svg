<rect x="235.7" y="586.8" width="12.0" height="29.8" rx="3" fill="none" stroke="#6d4c41" stroke-width="2"/>
<rect x="1150.0" y="130.0" width="360.0" height="90.0" rx="6" fill="#fafafa" stroke="#d32f2f" stroke-width="2"/>
<text x="1160.0" y="152.0" font-size="14" fill="#d32f2f" text-anchor="start" font-weight="bold">2S LiPo (8.4 V full)</text>
<text x="1160.0" y="172.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Soldered to the ESC battery pads</text>
<text x="1160.0" y="190.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">The BEC input is on the same pads</text>
<rect x="640.0" y="130.0" width="330.0" height="84.0" rx="6" fill="#fafafa" stroke="#d32f2f" stroke-width="2"/>
<text x="650.0" y="152.0" font-size="14" fill="#d32f2f" text-anchor="start" font-weight="bold">5 V BEC (JHEMCU 54560)</text>
<text x="650.0" y="172.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Input: ESC battery pads</text>
<text x="650.0" y="190.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Output: 5 V to J6</text>
<rect x="500.3" y="282.5" width="33.8" height="16.0" rx="3" fill="#424242" stroke="#212121" stroke-width="1"/>
<circle cx="508.3" cy="290.5" r="4" fill="#ffd54f"/>
<circle cx="526.1" cy="290.5" r="4" fill="#ffd54f"/>
<text x="517.2" y="314.5" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold"></text>
<text x="498.3" y="312.5" font-size="14" fill="#212121" text-anchor="middle" font-weight="bold">−</text>
<text x="536.1" y="312.5" font-size="14" fill="#d32f2f" text-anchor="middle" font-weight="bold">+</text>
<text x="556.1" y="295.5" font-size="12" fill="#d32f2f" text-anchor="start" font-weight="bold">J6: 5 V in, straight to VIN</text>
<polyline points="1220.0,220.0 1220.0,360.0" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
<polyline points="1300.0,220.0 1300.0,360.0" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round"/>
