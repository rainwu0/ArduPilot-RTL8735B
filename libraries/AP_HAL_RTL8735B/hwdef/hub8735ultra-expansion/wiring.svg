<polyline points="640.0,190.0 508.3,190.0 508.3,282.5" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<text x="1228.0" y="350.0" font-size="11" fill="#d32f2f" text-anchor="start" font-weight="bold">battery pads</text>
<rect x="1150.0" y="360.0" width="360.0" height="330.0" rx="6" fill="#fafafa" stroke="#00838f" stroke-width="2"/>
<text x="1160.0" y="382.0" font-size="14" fill="#00838f" text-anchor="start" font-weight="bold">4-in-1 ESC: MicoAir Bluejay-4IN1-33A</text>
<text x="1160.0" y="402.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Bluejay firmware; no telemetry wire</text>
<text x="1160.0" y="420.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Connector SH1.0-8P, maker's drawing,</text>
<text x="1160.0" y="438.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">connector up, left to right:</text>
<text x="1160.0" y="456.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Curr | NC | M4 | M3 | M2 | M1 | VBAT | GND</text>
<text x="1160.0" y="484.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">M1 ← J4 pin 1 (output 1, D11)</text>
<text x="1160.0" y="509.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">M2 ← J4 pin 2 (output 2, D22)</text>
<text x="1160.0" y="534.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">M3 ← J4 pin 3 (output 3, D23)</text>
<text x="1160.0" y="559.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">M4 ← J4 pin 4 (output 4, D24)</text>
<text x="1160.0" y="584.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">GND ← J4 pin 5 (the only ground wire)</text>
<text x="1160.0" y="609.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">Curr → J5 pin 1</text>
<text x="1160.0" y="634.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">VBAT → J3 pin 1</text>
<text x="1160.0" y="659.0" font-size="12" fill="#616161" text-anchor="start" font-weight="bold">NC: not connected</text>
<rect x="518.1" y="549.2" width="16.0" height="87.1" rx="3" fill="#424242" stroke="#212121" stroke-width="1"/>
