<circle cx="223.9" cy="557.2" r="4" fill="#ffd54f"/>
<circle cx="223.9" cy="575.0" r="4" fill="#ffd54f"/>
<circle cx="223.9" cy="592.8" r="4" fill="#ffd54f"/>
<text x="237.9" y="579.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">J5</text>
<polyline points="223.9,557.2 80.0,557.2 80.0,790.0 1100.0,790.0 1100.0,605.0 1150.0,605.0" fill="none" stroke="#6a1b9a" stroke-width="3" stroke-linejoin="round"/>
<text x="100.0" y="549.2" font-size="12" fill="#6a1b9a" text-anchor="start" font-weight="bold">Curr</text>
<text x="100.0" y="596.8" font-size="11" fill="#616161" text-anchor="start" font-weight="normal">pins 2, 3: n.c.</text>
<rect x="215.9" y="282.5" width="16.0" height="33.8" rx="3" fill="#424242" stroke="#212121" stroke-width="1"/>
<circle cx="223.9" cy="290.5" r="4" fill="#ffd54f"/>
<circle cx="223.9" cy="308.3" r="4" fill="#ffd54f"/>
<text x="237.9" y="303.4" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">J3</text>
<polyline points="223.9,290.5 60.0,290.5 60.0,812.0 1080.0,812.0 1080.0,630.0 1150.0,630.0" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linejoin="round"/>
<text x="80.0" y="282.5" font-size="12" fill="#6d4c41" text-anchor="start" font-weight="bold">VBAT</text>
<text x="80.0" y="322.3" font-size="11" fill="#616161" text-anchor="start" font-weight="normal">pin 2: n.c.</text>
<rect x="40.0" y="850.0" width="830.0" height="176.0" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="54.0" y="878.0" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">On the expansion board</text>
<text x="54.0" y="912.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J6 +  → 5V (VIN) directly; −  → GND. No reverse-polarity protection; the VBUS of both USB-C ports is on the same 5 V net.</text>
<text x="54.0" y="946.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J3 pin 1 → 100 kΩ / 20 kΩ (× 6.0) → JP1 → D2, analog pin 2.  2S full 8.4 V → 1.40 V on D2.</text>
<text x="54.0" y="980.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J5 pin 1 → 1 kΩ → D9 (PA2), analog pin 9; JP3 adds 100 nF to GND.  12.75 mV/A → BATT_AMP_PERVLT ≈ 78.4.</text>
<text x="54.0" y="1014.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J4 pins 1–4 → 220 Ω → D11, D22, D23, D24 (outputs 1–4), each with a 10 kΩ pull-down; pin 5 is motor ground.</text>
<polyline points="1260.0,830.0 1400.0,970.0" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linejoin="round"/>
<polyline points="1400.0,830.0 1260.0,970.0" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linejoin="round"/>
