<text x="1160.0" y="634.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">VBAT → J3 第 1 腳</text>
<text x="1160.0" y="659.0" font-size="12" fill="#616161" text-anchor="start" font-weight="bold">NC：不接</text>
