<rect x="40.0" y="850.0" width="830.0" height="176.0" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="54.0" y="878.0" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">擴充板上的路徑</text>
<text x="54.0" y="912.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J6 ＋ 直接接 5V（VIN），－ 接 GND。沒有防反接；兩個 USB-C 的 VBUS 也在同一個 5 V 上。</text>
<text x="54.0" y="946.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J3 第 1 腳 → 100 kΩ／20 kΩ（×6.0）→ JP1 → D2，類比腳 2。2S 滿電 8.4 V，D2 上 1.40 V。</text>
<text x="54.0" y="980.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J5 第 1 腳 → 1 kΩ → D9（PA2），類比腳 9；JP3 加 100 nF 到地。12.75 mV/A → BATT_AMP_PERVLT 約 78.4。</text>
<text x="54.0" y="1014.0" font-size="12.5" fill="#212121" text-anchor="start" font-weight="normal">J4 第 1～4 腳 → 220 Ω → D11、D22、D23、D24（輸出 1～4），各有 10 kΩ 下拉；第 5 腳是馬達地。</text>
