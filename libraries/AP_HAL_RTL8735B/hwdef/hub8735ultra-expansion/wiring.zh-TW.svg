<text x="1160.0" y="402.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">韌體 Bluejay；沒有回傳線</text>
<text x="1160.0" y="420.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">接頭 SH1.0-8P，廠商圖（接頭朝上）</text>
<text x="1160.0" y="438.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">由左到右：</text>
<text x="1160.0" y="456.0" font-size="12" fill="#616161" text-anchor="start" font-weight="normal">Curr | NC | M4 | M3 | M2 | M1 | VBAT | GND</text>
<text x="1160.0" y="484.0" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">M1 ← J4 第 1 腳（輸出 1，D11）</text>
