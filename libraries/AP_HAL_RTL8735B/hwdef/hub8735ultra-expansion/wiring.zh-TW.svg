<text x="40.0" y="68.0" font-size="13" fill="#616161" text-anchor="start" font-weight="normal">俯視、元件面朝上，開發板插在擴充板上面。線色：紅＝電源、黑＝地、青＝DShot、棕＝電池電壓、紫＝電流。</text>
<text x="40.0" y="88.0" font-size="13" fill="#616161" text-anchor="start" font-weight="normal">擴充板是手焊的 v1（50 × 70 mm 洞洞板）。</text>
