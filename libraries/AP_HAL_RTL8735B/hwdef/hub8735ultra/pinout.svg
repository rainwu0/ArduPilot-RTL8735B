<text x="235" y="806" font-size="12" fill="#111">I²C</text>
<line x1="283" y1="802" x2="305" y2="802" stroke="#e07b00" stroke-width="4"/>
<text x="311" y="806" font-size="12" fill="#111">SPI</text>
<line x1="359" y1="802" x2="381" y2="802" stroke="#2a9d3a" stroke-width="4"/>
<text x="387" y="806" font-size="12" fill="#111">UART</text>
<line x1="443" y1="802" x2="465" y2="802" stroke="#8a3fb8" stroke-width="4"/>
<text x="471" y="806" font-size="12" fill="#111">PWM output</text>
<line x1="571" y1="802" x2="593" y2="802" stroke="#0f8c8c" stroke-width="4"/>
<text x="599" y="806" font-size="12" fill="#111">Analog in</text>
<line x1="691" y1="802" x2="713" y2="802" stroke="#5a5a5a" stroke-width="4"/>
<text x="719" y="806" font-size="12" fill="#111">GPIO</text>
<line x1="775" y1="802" x2="797" y2="802" stroke="#999999" stroke-width="4"/>
<text x="803" y="806" font-size="12" fill="#111">Unassigned or unused</text>
<line x1="977" y1="802" x2="999" y2="802" stroke="#b00000" stroke-width="4"/>
<text x="1005" y="806" font-size="12" fill="#111">Do not connect (✕)</text>
<text x="40" y="836" font-size="12" fill="#b00000">The five pins not to connect: D14 decides at reset whether the chip enters download mode and also enables the camera LDOs;</text>
<text x="40" y="856" font-size="12" fill="#b00000">D12 is the upgrade button, so pulling it low is the same as holding upgrade; D13 drives the transistor of the white fill light;</text>
<text x="40" y="876" font-size="12" fill="#b00000">D16 and D17 are the LOG UART, wired to the on-board USB serial port (flashing, boot messages, SERIAL0).</text>
<text x="40" y="900" font-size="12" fill="#333">The square pad is pin 1 of each group, at the microSD end; pin numbers increase towards USB-C. Power modules from 3.3 V: the RTL8735B I/O is 3.3 V.</text>
<text x="40" y="924" font-size="12" fill="#333">USB-C: CNA1 on the right goes through a CH340N to the LOG UART (flashing, SERIAL0); CNA2 on the left is the chip's own USB.</text>
<text x="40" y="948" font-size="11" fill="#555">Header positions follow the Gerber and placement drawings, and pin connections the schematic and module specification, in ideashatch/HUB-8735 870a7e08de7a; drawn for this repository.</text>
</svg>
