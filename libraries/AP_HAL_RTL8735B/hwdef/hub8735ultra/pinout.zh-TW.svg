<text x="427" y="806" font-size="12" fill="#111">UART</text>
<line x1="505" y1="802" x2="527" y2="802" stroke="#8a3fb8" stroke-width="4"/>
<text x="533" y="806" font-size="12" fill="#111">PWM 輸出</text>
<line x1="637" y1="802" x2="659" y2="802" stroke="#0f8c8c" stroke-width="4"/>
<text x="665" y="806" font-size="12" fill="#111">類比輸入</text>
<line x1="743" y1="802" x2="765" y2="802" stroke="#5a5a5a" stroke-width="4"/>
<text x="771" y="806" font-size="12" fill="#111">GPIO</text>
<line x1="849" y1="802" x2="871" y2="802" stroke="#999999" stroke-width="4"/>
<text x="877" y="806" font-size="12" fill="#111">未設定或不用</text>
<line x1="981" y1="802" x2="1003" y2="802" stroke="#b00000" stroke-width="4"/>
<text x="1009" y="806" font-size="12" fill="#111">不可接（✕）</text>
<text x="40" y="836" font-size="12" fill="#b00000">不可接的五支：D14 在重置時決定是否進燒錄模式，也是相機 LDO 的致能；D12 是 upgrade 鍵，拉低它等於按著 upgrade；</text>
<text x="40" y="856" font-size="12" fill="#b00000">D13 接板上白色補光燈的驅動電晶體；D16、D17 是 LOG UART，接板上的 USB 序列埠（燒錄、開機訊息、SERIAL0）。</text>
<text x="40" y="880" font-size="12" fill="#333">方形焊墊是每組的第 1 腳，在 microSD 端；腳號往 USB-C 端增加。模組一律接 3.3 V，RTL8735B 的 I/O 是 3.3 V。</text>
<text x="40" y="904" font-size="12" fill="#333">USB-C：右邊的 CNA1 經 CH340N 接 LOG UART（燒錄、SERIAL0），左邊的 CNA2 接晶片自己的 USB。</text>
<text x="40" y="928" font-size="11" fill="#555">排針位置依 ideashatch/HUB-8735 870a7e08de7a 的 Gerber 與元件位置圖，各腳的接法依同一提交的原理圖與模組規格書；圖是自行繪製。</text>
</svg>
