<circle cx="700" cy="588" r="7" fill="#fff" stroke="#333" stroke-width="1.6"/>
<text x="682" y="592" font-size="10" text-anchor="middle" fill="#555">5</text>
<line x1="712" y1="588" x2="750" y2="588" stroke="#8a3fb8" stroke-width="3"/>
<text x="756" y="592" font-size="12" font-weight="normal" fill="#8a3fb8">D22 · PF11：PWM 輸出 2</text>
